# Visual Studio Code 공식 문서 종합 가이드

Visual Studio Code는 Microsoft에서 제공하는 강력한 무료 코드 편집기입니다. 다음은 [code.visualstudio.com/docs](https://code.visualstudio.com/docs)의 주요 섹션에 대한 체계적인 요약입니다.

## 📥 설정 및 설치

**문서:** [설정 개요](https://code.visualstudio.com/docs/setup/setup-overview)

VS Code는 200MB 미만의 경량 다운로드로 빠르게 설치할 수 있습니다.

### 주요 기능:
- **크로스 플랫폼 지원**: [Windows](https://code.visualstudio.com/docs/setup/windows), [macOS](https://code.visualstudio.com/docs/setup/mac), [Linux](https://code.visualstudio.com/docs/setup/linux)
- **주간 업데이트**: 새로운 기능과 버그 수정이 정기적으로 제공됨
- **Insiders 빌드**: 최신 기능을 미리 시험할 수 있는 야간 빌드 제공
- **휴대용 모드**: USB 드라이브 등 어디서나 실행 가능한 portable 버전 지원
- **추가 구성요소**: [Git, Node.js, 프로그래밍 언어 런타임](https://code.visualstudio.com/docs/setup/additional-components) 등 설치 가능

---

## 🚀 시작하기

**문서:** [VS Code 튜토리얼](https://code.visualstudio.com/docs/getstarted/getting-started)

초보자를 위한 실전 가이드로 핵심 기능을 단계별로 학습할 수 있습니다.

### 주요 내용:
1. **폴더 열기**: 워크스페이스 구성 및 신뢰 설정
2. **사용자 인터페이스 탐색**: 
   - Activity Bar로 뷰 전환
   - Editor에서 파일 편집 및 IntelliSense 활용
   - 통합 터미널 사용 (Ctrl+`)
   - Command Palette 활용 (Ctrl+Shift+P)
3. **AI 에이전트로 앱 구축**: 자연어 프롬프트로 완전한 앱 생성
4. **확장 프로그램 설치**: [Live Preview](https://marketplace.visualstudio.com/items?itemName=ms-vscode.live-server) 등 개발 도구 추가
5. **설정 구성**: Auto Save, 테마 등 개인화
6. **소스 제어**: Git 저장소 초기화 및 커밋
7. **디버깅**: 브레이크포인트 설정 및 단계별 실행

---

## 🎨 사용자 인터페이스

**문서:** [사용자 인터페이스](https://code.visualstudio.com/docs/getstarted/userinterface)

VS Code의 직관적인 레이아웃으로 효율적인 코딩 경험을 제공합니다.

### 인터페이스 구성 요소:
- **Editor**: 파일 편집의 중심 영역
- **Primary Side Bar**: 탐색기, 검색, 소스 제어 등의 뷰 표시
- **Secondary Side Bar**: 기본값으로 Chat 뷰 표시
- **Status Bar**: 프로젝트 및 파일 정보 표시
- **Activity Bar**: 좌측 뷰 전환 버튼
- **Panel**: 터미널, 디버그, 출력 정보 표시

### 주요 기능:
- **[나란히 편집](https://code.visualstudio.com/docs/getstarted/userinterface#_side-by-side-editing)**: Ctrl+\ 로 분할
- **[미니맵](https://code.visualstudio.com/docs/getstarted/userinterface#_minimap)**: 코드 개요 표시
- **[Sticky Scroll](https://code.visualstudio.com/docs/getstarted/userinterface#_sticky-scroll)**: 중첩된 범위 헤더 표시
- **[탭 관리](https://code.visualstudio.com/docs/getstarted/userinterface#_tabs)**: 미리보기 모드, 핀 고정, 래핑
- **[Zen Mode](https://code.visualstudio.com/docs/getstarted/userinterface#_zen-mode)**: 집중 모드 (Ctrl+K Z)
- **[명령 팔레트](https://code.visualstudio.com/docs/getstarted/userinterface#_command-palette)**: Ctrl+Shift+P로 모든 기능 접근

## 💻 프로그래밍 언어

**문서:** [프로그래밍 언어 개요](https://code.visualstudio.com/docs/languages/overview)

VS Code는 거의 모든 주요 프로그래밍 언어를 지원합니다.

### 지원 언어 (기본 탑재):
- JavaScript, TypeScript, CSS, HTML, JSON, Markdown

### 인기 있는 확장 프로그램:
- [Python](https://marketplace.visualstudio.com/items?itemName=ms-python.python)
- [Java](https://marketplace.visualstudio.com/items?itemName=redhat.java)
- [C++](https://marketplace.visualstudio.com/items?itemName=ms-vscode.cpptools)
- [Go](https://marketplace.visualstudio.com/items?itemName=golang.Go)
- [Rust](https://marketplace.visualstudio.com/items?itemName=rust-lang.rust-analyzer)
- [C#](https://marketplace.visualstudio.com/items?itemName=ms-dotnettools.csharp)

### 주요 기능:
- **문법 강조**: 코드 가독성 향상
- **IntelliSense**: 똑똑한 자동완성 (Ctrl+Space)
- **코드 네비게이션**: 정의로 이동, 모든 참조 찾기
- **린팅 및 수정**: 코드 품질 검사
- **디버깅**: 언어별 디버거 확장
- **리팩토링**: 안전한 코드 구조 변경
- **AI 완성**: [GitHub Copilot](https://code.visualstudio.com/docs/copilot/overview)으로 향상된 제안

---

## 🔧 편집기 및 확장

### 편집기 기능:
**문서:** [코드 기본 사항](https://code.visualstudio.com/docs/editor/codebasics)
- 코드 폴딩 및 지역 표시
- 검색 및 바꾸기 (Ctrl+H)
- 여러 선택 및 편집
- 코드 조각 (Snippets)
- 선호도 및 설정 커스터마이징

### 확장 프로그램 마켓플레이스:
**문서:** [확장 프로그램 마켓플레이스](https://code.visualstudio.com/docs/editor/extension-marketplace)

수천 개의 확장으로 VS Code를 확장할 수 있습니다.

- **설치**: Extensions 뷰 (Ctrl+Shift+X)에서 검색 및 설치
- **관리**: 활성화/비활성화, 업데이트, 제거
- **추천**: 워크스페이스 권장 확장 설정
- **검색 필터**: @installed, @recommended, @category 등으로 효율적인 검색
- **보안**: 확장 서명 검증 및 권한 확인

---

## 🔀 버전 제어

**문서:** [소스 제어 개요](https://code.visualstudio.com/docs/sourcecontrol/overview)

Git은 기본적으로 통합되어 있으며, 터미널 없이 모든 작업을 수행할 수 있습니다.

### 주요 기능:
- **Source Control 뷰**: Git 작업의 중심 허브
- **변경 사항 검토**: Diff 편집기로 변경 내용 비교
- **스테이징 및 커밋**: 파일 또는 특정 라인만 선택적으로 커밋
- **AI 커밋 메시지**: Copilot으로 자동 생성
- **동기화**: 원격 저장소와 푸시/풀/페치
- **브랜치 관리**: 빠른 브랜치 전환 및 생성
- **병합 충돌 해결**: 3-way 병합 편집기 지원
- **Git 히스토리**: 그래프 뷰 및 Timeline 뷰
- **[GitHub 통합](https://code.visualstudio.com/docs/sourcecontrol/github)**: Pull Request 및 Issue 관리

### 추가 VCS:
- [Azure DevOps](https://marketplace.visualstudio.com/items?itemName=ms-azure-devops.azure-pipelines)
- [Subversion](https://marketplace.visualstudio.com/items?itemName=johnstoncode.svn)
- [Mercurial](https://marketplace.visualstudio.com/items?itemName=mrcrowl.hg)

## 🐛 디버깅

**문서:** [코드 디버깅](https://code.visualstudio.com/docs/debugtest/debugging)

VS Code는 강력한 디버깅 도구를 기본 제공합니다.

### 지원 언어:
- **기본 제공**: JavaScript, TypeScript, Node.js
- **확장 프로그램**: Python, Java, C++, C#, Go, PHP, Ruby 등

### 디버깅 기능:
- **브레이크포인트**: 
  - 일반 브레이크포인트 (F9)
  - 조건부 브레이크포인트
  - 로그포인트 (Log Points)
  - 함수 브레이크포인트
  - 데이터 브레이크포인트
- **실행 제어**: 
  - Continue/Pause (F5)
  - Step Over (F10)
  - Step Into (F11)
  - Step Out (Shift+F11)
  - Restart (Ctrl+Shift+F5)
- **데이터 검사**: 변수, 식, 호출 스택 모니터링
- **Debug Console REPL**: 실시간 식 평가
- **다중 대상 디버깅**: 여러 프로세스 동시 디버깅
- **원격 디버깅**: Node.js 원격 디버깅 지원

---

## ✅ 테스팅

**문서:** [테스트](https://code.visualstudio.com/docs/debugtest/testing)

VS Code의 통합 테스트 기능으로 테스트 중심 개발을 지원합니다.

### 주요 기능:
- **Test Explorer**: 중앙화된 테스트 관리 및 실행
- **자동 발견**: 프로젝트의 테스트 자동 감지
- **인라인 결과**: 편집기에서 테스트 상태 표시
- **AI 테스트 생성**: Copilot으로 테스트 코드 자동 생성
- **AI 테스트 수정**: 실패한 테스트 자동 수정 제안
- **커버리지**: 테스트 커버리지 시각화
- **통합**: 여러 프레임워크 지원 (Jest, Mocha, Pytest, JUnit 등)

### 지원 프레임워크:
- Python: pytest, unittest
- Java: JUnit, TestNG
- JavaScript: Jest, Mocha, Vitest
- C#: NUnit, xUnit
- Go: testing 패키지

---

## 🌐 원격 개발

**문서:** [VS Code 원격 개발](https://code.visualstudio.com/docs/remote/remote-overview)

로컬 머신의 파일 없이도 원격 환경에서 완벽한 개발 경험을 제공합니다.

### 주요 기능:
- **[Remote - SSH](https://code.visualstudio.com/docs/remote/ssh)**: SSH를 통해 원격 머신/VM에 연결
- **[Dev Containers](https://code.visualstudio.com/docs/devcontainers/containers)**: Docker 컨테이너 내에서 개발
- **[WSL](https://code.visualstudio.com/docs/remote/wsl)**: Windows Subsystem for Linux 지원
- **[Remote - Tunnels](https://code.visualstudio.com/docs/remote/tunnels)**: 안전한 터널로 원격 접속 (SSH 설정 불필요)
- **[GitHub Codespaces](https://code.visualstudio.com/docs/remote/codespaces)**: 클라우드 기반 개발 환경

---

## 🤖 GitHub Copilot & AI

**문서:** [GitHub Copilot 개요](https://code.visualstudio.com/docs/copilot/overview)

VS Code에 AI 기반 개발 보조 기능이 통합되어 있습니다.

### 주요 기능:
- **AI 에이전트**: 자연어로 작업을 설명하면 자동으로 실행
  - 로컬, 백그라운드, 클라우드에서 실행
  - 여러 파일 편집 및 명령 실행
  - 오류 자동 수정

- **[인라인 제안](https://code.visualstudio.com/docs/copilot/ai-powered-suggestions)**: 코드 입력 중 자동 완성
- **[인라인 Chat](https://code.visualstudio.com/docs/copilot/chat/inline-chat)**: Ctrl+I로 편집기 내 채팅
- **[Smart Actions](https://code.visualstudio.com/docs/copilot/copilot-smart-actions)**: 커밋 메시지 생성, 에러 수정 등
- **커스터마이징**:
  - [Custom Instructions](https://code.visualstudio.com/docs/copilot/customization/custom-instructions): 프로젝트 규칙 정의
  - [Agent Skills](https://code.visualstudio.com/docs/copilot/customization/agent-skills): 맞춤 능력 추가
  - [Custom Agents](https://code.visualstudio.com/docs/copilot/customization/custom-agents): 역할별 에이전트 생성
  - [MCP Servers](https://code.visualstudio.com/docs/copilot/customization/mcp-servers): 도구 확장

## 🏢 엔터프라이즈 기능

**문서:** [엔터프라이즈용 VS Code](https://code.visualstudio.com/docs/enterprise/overview)

조직 규모의 배포 및 관리를 위한 기능들입니다.

### 엔터프라이즈 정책:
- **AI 및 Copilot**: 에이전트 모드, MCP 서버, 도구 승인 제어
- **확장 프로그램**: 허용 확장 목록, 비공개 마켓플레이스
- **원격 측정**: 데이터 수집 수준, 피드백 메커니즘 제어
- **자동 업데이트**: 업데이트 시기 및 방법 제어
