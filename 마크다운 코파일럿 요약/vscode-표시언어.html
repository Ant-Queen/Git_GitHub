원문: https://code.visualstudio.com/docs/configure/locales

## 1. 개요

Visual Studio Code는 기본적으로 영어 UI를 사용하며, 다른 언어는 Language Pack 확장을 통해 제공됩니다. 운영 체제의 UI 언어를 감지하여 적절한 Language Pack 설치를 권장합니다.
